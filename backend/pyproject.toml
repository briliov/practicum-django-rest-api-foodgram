[tool.ruff]
line-length = 79
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.format]
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "I",
    "COM",
    "COM812"
]

[tool.ruff.lint.isort]
combine-as-imports = true


[tool.flake8]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
]
per-file-ignores = [
    "settings.py:E501",
]