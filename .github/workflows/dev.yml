name: Development workflow

on:
  push:
    branches:
      - dev

jobs:
  testing-backend:
    name: Testing backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image:
          postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: <PASSWORD>
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: |
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r backend/requirements/requirements.lint.txt
          pip install -r backend/requirements/requirements.txt
      - name: Run linter
        run: |
          cd backend/
          python -m flake8
      - name: Test with django tests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: <PASSWORD>
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          cd backend/
          python manage.py test

  telegram-notification:
    name: Send Telegram notification
    runs-on: ubuntu-latest
    needs: [testing-backend]
    if: always()
    steps:
      - name: Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Tests in development branch:
            ----------------------------
            Backend status: ${{ needs.testing-backend.result }}
            ----------------------------
            Repository: ${{ github.repository }}
            Logs: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}