name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  testing-backend:
    name: Testing backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image:
          postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: 12sdas312
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r backend/requirements/requirements.lint.txt
          pip install -r backend/requirements/requirements.txt
      - name: Run linter
        run: |
          cd backend/
          python -m flake8
      - name: Test with django tests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: <PASSWORD>
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          cd backend/
          python manage.py test

  build-and-push-to-docker-hub:
    strategy:
      matrix:
        type: [frontend, backend, nginx]
        include:
          - type: frontend
            path: ./frontend/
          - type: backend
            path: ./backend/
          - type: nginx
            path: ./infra/
    name: Build ${{ matrix.type }} Docker image and Push to DockerHUB
    runs-on: ubuntu-latest
    needs: [testing-backend]
    steps:
      - name: Set up the repo
        uses: actions/checkout@v3
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHUB
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_${{ matrix.type }}:latest
          target: ${{ matrix.type == 'backend' && 'production' || null }}
  
  server-deploy:
    name: Deploy on production server
    runs-on: ubuntu-latest
    needs:
      - build-and-push-to-docker-hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'infra/docker-compose.production.yml'
          target: 'foodgram'
          strip_components: 1
      - name: Copy nginx.conf via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'infra/nginx.conf'
          target: 'foodgram'
          strip_components: 1
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd foodgram
            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml down
            sudo docker compose -f docker-compose.production.yml up -d
            sleep 10
            sudo docker container exec foodgram-backend python manage.py migrate
            sudo docker container exec foodgram-backend python manage.py collectstatic

  telegram-notification:
    name: Send Telegram notification
    runs-on: ubuntu-latest
    needs: [server-deploy]
    if: always()
    steps:
      - name: Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Deploy main branch on production server:
            ----------------------------
            Backend status: ${{ needs.testing-backend.result }}
            ----------------------------
            Repository: ${{ github.repository }}
            Logs: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}