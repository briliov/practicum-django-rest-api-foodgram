server {
    server_tokens off;
    listen 80;
    client_max_body_size 10M;

    location /api/docs/ {
        alias /var/www/docs/;
        index redoc.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /backend/ {
        root /var/www/;
    }

    location / {
        alias /var/www/frontend/;
        index index.html index.htm;
    }

}
