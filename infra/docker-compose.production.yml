volumes:
  db:
  backend_static:
  frontend_static:
  media:

services:
  database:
    container_name: foodgram-database
    image: postgres:15
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      retries: 5

  backend:
    container_name: foodgram-backend
    image: nexordon/foodgram_backend
    volumes:
      - backend_static:/app/static
      - media:/app/media
    env_file: .env
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: foodgram-frontend
    image: nexordon/foodgram_frontend
    volumes:
      - frontend_static:/app/result_build
 
  nginx:
    container_name: foodgram-nginx
    image: nginx:1.25.4-alpine
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template
      - backend_static:/var/www/django/static
      - media:/var/www/django/media
      - frontend_static:/usr/share/nginx/html
    depends_on:
      - database
      - backend
      - frontend
