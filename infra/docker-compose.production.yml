volumes:
  db:
  static:
  
services:
  database:
    container_name: foodgram-database
    image: postgres:15
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      retries: 5

  backend:
    container_name: foodgram-backend
    image: nexordon/foodgram_backend
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: foodgram-frontend
    image: nexordon/foodgram_frontend
    volumes:
      - ./frontend/:/app/result_build/
 
  nginx:
    container_name: foodgram-nginx
    image: nginx:1.25.4-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/build:/usr/share/nginx/html/
      - ./backend/static:/var/www/django/static/
      - ./backend/media:/var/www/django/media/
    depends_on:
      - database
      - backend
      - frontend
