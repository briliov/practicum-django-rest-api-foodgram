volumes:
  db:
  static:

services:
  database:
    container_name: foodgram-database
    image: postgres:15
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      retries: 5

  backend:
    container_name: foodgram-backend
    image: nexordon/foodgram_backend
    volumes:
      - type: volume
        source: static
        target: /app/backend
        volume:
          subpath: backend
    env_file: .env
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: foodgram-frontend
    image: nexordon/foodgram_frontend
    volumes:
      - type: volume
        source: static
        target: /app/result_build
        volume:
          subpath: frontend/
 
  nginx:
    container_name: foodgram-nginx
    image: nexordon/foodgram_nginx
    ports:
      - 8000:80
    volumes:
      - static/backend/:/var/www/backend/
      - static/frontend/:/var/www/frontend/
    depends_on:
      - database
      - backend
      - frontend
