volumes:
  db:
  static:
  
services:
  database:
    container_name: foodgram-database
    image: postgres:15
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      retries: 5

  backend:
    container_name: foodgram-backend
    image: nexordon/foodgram_backend
    volumes:
      - type: volume
        source: static
        target: /app/static
        volume:
          subpath: backend/static
      - type: volume
        source: static
        target: /app/media
        volume:
          subpath: backend/media
    env_file: .env
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: foodgram-frontend
    image: nexordon/foodgram_frontend
    volumes:
      - type: volume
        source: static
        target: /app/result_build
        volume:
          subpath: frontend/build
 
  nginx:
    container_name: foodgram-nginx
    image: nginx:1.25.4-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - type: volume
        source: static
        target: /var/www/django/static
        volume:
          subpath: backend/static
      - type: volume
        source: static
        target: /var/www/django/media
        volume:
          subpath: backend/media
      - type: volume
        source: static
        target: /usr/share/nginx/html
        volume:
          subpath: frontend/build
    depends_on:
      - database
      - backend
      - frontend
