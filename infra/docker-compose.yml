volumes:
  db:
  
services:
  database:
    container_name: foodgram-database
    image: postgres:15
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      retries: 5

  backend:
    container_name: foodgram-backend
    build: 
      context: ../backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ../backend:/app
    env_file: .env
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: foodgram-frontend
    build: ../frontend
    volumes:
      - ../frontend/build:/app/result_build/

  nginx:
    container_name: foodgram-nginx
    build:
      context: ../
      dockerfile: infra/Dockerfile
    ports:
      - 80:80
    volumes:
      - ../backend/backend:/var/www/backend
      - ../frontend/build:/var/www/frontend
    depends_on:
      - database
      - backend
      - frontend
